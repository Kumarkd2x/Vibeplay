# Gradle JVM Arguments - Build ke time kitni memory use kare
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX Support - Modern libraries ke liye zaroori
android.useAndroidX=true

# Jetifier - Purani libraries ko AndroidX me convert karta hai
android.enableJetifier=true

# Kotlin Code Style
kotlin.code.style=official

# Non-Transitive R Classes - Build fast karta hai, memory bachata hai
android.nonTransitiveRClass=true

# R8 Full Mode - Code shrink aur obfuscate karta hai (APK size kam)
android.enableR8.fullMode=true
